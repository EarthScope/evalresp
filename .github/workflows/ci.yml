name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  unix:
    name: ${{ matrix.os }} ${{ matrix.cc }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            cc: gcc
          - os: ubuntu-latest
            cc: clang
          - os: macos-latest
            cc: clang
    steps:
      - uses: actions/checkout@v7
      - name: Build and test
        run: make check CC=${{ matrix.cc }}
      - name: Upload test output
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-work-${{ matrix.os }}-${{ matrix.cc }}
          path: tests/work

  windows:
    name: windows-latest msvc
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: TheMrMilchmann/setup-msvc-dev@v4
        with:
          arch: x64
      - name: Build and test
        shell: cmd
        run: nmake /F Makefile.nmake check
      - name: Upload test output
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-work-windows-msvc
          path: tests/work
