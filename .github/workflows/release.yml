# Drafts a GitHub release from a version tag.  Publishing the draft, which
# triggers the Zenodo archive, is done by hand.
#
# To release: set the version in libsrc/evalresp/public.h, CITATION.cff and
# the top section of ChangeLog; tag vX.Y.Z and push the tag; review the draft
# release on GitHub and publish it.
name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check version
        run: |
          ver="${GITHUB_REF_NAME#v}"
          status=0
          check () {
            if [ "$2" != "$ver" ]; then
              echo "::error::$1 has version '$2', tag is '$ver'"
              status=1
            fi
          }
          check libsrc/evalresp/public.h \
            "$(sed -n 's/^#define REVNUM "\(.*\)"/\1/p' libsrc/evalresp/public.h)"
          check CITATION.cff \
            "$(sed -n 's/^version: *//p' CITATION.cff)"
          check ChangeLog \
            "$(sed -n '1s/^Version //p' ChangeLog)"
          exit $status
      - name: Build and test
        run: make check
      - name: Extract release notes
        run: |
          awk 'NR == 1 { next } /^Version / { exit } { print }' ChangeLog > notes.txt
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag \
            --title "evalresp ${GITHUB_REF_NAME#v}" --notes-file notes.txt
